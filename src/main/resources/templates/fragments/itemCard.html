<div th:fragment="itemCard(item, basePath, description, hasImages, canEdit, showStatus, posterName, holderName)"
     class="card h-100 shadow-sm">

    <div class="card-body d-flex flex-column">
        <div class="d-flex flex-wrap justify-content-between align-items-start gap-2 mb-2">
            <h6 class="card-title mb-0 text-break fs-6">
                <a th:href="@{|${basePath}/${item.id}|}"
                   th:text="${#strings.length(item.title) > 55 ? #strings.substring(item.title, 0, 55) + '...' : item.title}"
                   class="text-decoration-none text-dark">Item title</a>
            </h6>
        </div>

        <!-- Poster, Holder & Dates above the description -->
        <div class="small text-muted mb-2">
            <div th:if="${posterName != null and !#strings.isEmpty(posterName)}">
                Poster: <span th:text="${posterName}" class="fw-semibold"></span>
            </div>
            <div th:if="${holderName != null and !#strings.isEmpty(holderName)}">
                Holder: <span th:text="${holderName}" class="fw-semibold"></span>
            </div>
            <div>Posted: <span th:text="${#temporals.format(item.datePosted, 'dd.MM.yyyy')}"></span> Updated: <span th:text="${#temporals.format(item.lastUpdated, 'dd.MM.yyyy')}"></span></div>
        </div>

        <!-- First 100 characters of the description, when there is one -->
        <p th:if="${description != null and !#strings.isEmpty(description)}"
           th:text="${#strings.length(description) > 100 ? #strings.substring(description, 0, 100) + '...' : description}"
           class="card-text text-break">Description</p>

        <!-- Images indicator & Status badge at the bottom -->
        <div class="mt-auto pt-2 d-flex flex-column gap-2">
            <div th:if="${showStatus}" class="small text-muted d-flex align-items-center gap-1">
                <span>Status:</span>
                <span th:text="${item.status.displayName}"
                      th:classappend="${item.status.name() == 'PERMANENTLY_LOST'} ? 'badge-relative badge-relative-danger' : (${item.status.name() == 'UNRESOLVED'} ? 'badge-relative badge-relative-tomorrow' : 'badge-relative badge-relative-soon')">Status</span>
            </div>
            <p th:if="${hasImages != null and hasImages}" class="mb-0 small">
                <span class="text-success fw-semibold"><i class="bi bi-check-circle-fill me-1"></i>Contains images</span>
            </p>
        </div>
    </div>

    <div class="card-footer bg-transparent d-flex flex-wrap gap-2">
        <a th:href="@{|${basePath}/${item.id}|}" class="btn btn-sm btn-outline-secondary"><i class="bi bi-eye me-1"></i>View</a>
        <a th:if="${canEdit}"
           th:href="@{|${basePath}/edit/${item.id}|}"
           class="btn btn-sm btn-primary-custom"><i class="bi bi-pencil me-1"></i>Edit</a>
    </div>
</div>
