<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        .offcanvas-end {
            max-width: 250px;
        }
        .navbar-nav {
            text-align: left;
        }
    </style>
</head>
<body>
<header th:fragment="header" class="navbar navbar-expand-lg navbar-dark bg-dark px-4 py-3 d-print-none" id="headerpdf">
    <!-- Brand / Logo Endpoint -->
    <a class="nav-link d-flex align-items-center gap-2 text-white text-decoration-none" href="/">
        <img src="/FINKI-logo.png" alt="" id="logo-image" style="width: 25px;"/>
        <span>ФИНКИ Изгубено Најдено</span>
    </a>

    <button class="navbar-toggler" type="button" data-bs-toggle="offcanvas" data-bs-target="#offcanvasNavbar" aria-controls="offcanvasNavbar" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
    </button>

    <div class="offcanvas offcanvas-end bg-dark text-white" tabindex="-1" id="offcanvasNavbar" aria-labelledby="offcanvasNavbarLabel">
        <div class="offcanvas-header">
            <h5 class="offcanvas-title" id="offcanvasNavbarLabel">Навигација</h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas" aria-label="Close"></button>
        </div>
        <div class="offcanvas-body align-items-center">
            <!-- Nav Links -->
            <ul class="navbar-nav me-auto mb-2 mb-lg-0 align-items-lg-center">
                <li class="nav-item">
                    <a href="/lost-items" class="nav-link">Изгубено</a>
                </li>
                <li class="nav-item">
                    <a href="/found-items" class="nav-link">Најдено</a>
                </li>
                <li class="nav-item">
                    <a href="/my-reports" class="nav-link">Мои Пријави</a>
                </li>
            </ul>

            <!-- Username -->
            <ul class="navbar-nav align-items-lg-center">
                <th:block th:if="${#authentication.getPrincipal() == 'anonymousUser'}">
                    <li class="nav-item">
                        <a class="nav-link" href="/my-reports">Најави се</a>
                    </li>
                </th:block>
                <th:block sec:authorize="isAuthenticated()">
                    <li class="nav-item">
                        <a href="#" class="nav-link text-info" id="username" sec:authentication="name"></a>
                    </li>
                </th:block>
            </ul>
        </div>
    </div>
</header>
</body>
</html>
