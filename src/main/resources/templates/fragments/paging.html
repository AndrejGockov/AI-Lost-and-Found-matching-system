<div th:fragment="pageSection(page)" class="container-fluid px-0 my-3">
    <div class="row align-items-center g-3">
        <div class="col-12 col-md-8">
            <nav aria-label="Page navigation">
                <ul class="pagination mb-0 flex-wrap">
                    <li class="cursor-pointer page-item" th:class="${page.isFirst()} ? 'disabled page-item' : 'page-item'">
                        <a class="page-link" href="#" onClick="updateQueryStringParameter('pageNum', 1)"><i class="bi bi-chevron-double-left"></i> Прва</a>
                    </li>
                    <li class="page-item" th:class="${page.hasPrevious()} ? 'page-item' : 'disabled page-item'">
                        <a class="page-link" href="#"
                           onClick="updateQueryStringParameter('pageNum', this.getAttribute('page-number'))"
                           th:page-number="${page.number}"><i class="bi bi-chevron-left"></i> Претходна</a>
                    </li>
                    <li th:each="pageNum : ${#numbers.sequence(T(java.lang.Math).max(1,page.number-5), (page.totalPages == 0? 1: T(java.lang.Math).min(page.totalPages,page.number+5)))}"
                        th:class="${page.number+1 == pageNum} ? 'page-item active' : 'page-item'">
                        <a class="page-link" href="#"
                           onClick="updateQueryStringParameter('pageNum', this.getAttribute('page-number'))"
                           th:page-number="${pageNum}" th:text="${pageNum}"></a>
                    </li>
                    <li class="page-item" th:class="${page.hasNext()} ? 'page-item' : 'disabled page-item'">
                        <a class="page-link" href="#"
                           onClick="updateQueryStringParameter('pageNum', this.getAttribute('page-number'))"
                           th:page-number="${page.number+2}">Следна <i class="bi bi-chevron-right"></i></a>
                    </li>
                    <li class="page-item" th:class="${page.isLast()} ? 'disabled page-item' : 'page-item'">
                        <a class="page-link" href="#"
                           onClick="updateQueryStringParameter('pageNum', this.getAttribute('page-number'))"
                           th:page-number="${page.totalPages}">Последна <i class="bi bi-chevron-double-right"></i></a>
                    </li>
                </ul>
            </nav>
        </div>

        <div class="col-12 col-md-4">
            <div class="d-flex results-container align-items-center justify-content-md-end mb-0">
                <label for="results" class="mb-0 text-nowrap me-2">Резултати на страна: </label>
                <select id="results" class="form-control custom-select" style="max-width: 90px;"
                        onchange="updateQueryStringParameter('results',this.value)">
                    <option value="5" th:selected="${page.size == 5}">5</option>
                    <option value="10" th:selected="${page.size == 10}">10</option>
                    <option value="20" th:selected="${page.size == 20}">20</option>
                    <option value="50" th:selected="${page.size == 50}">50</option>
                    <option value="100" th:selected="${page.size == 100}">100</option>
                    <option value="1000" th:selected="${page.size == 1000}">1000</option>
                </select>
                <span class="ms-2 me-1 text-nowrap"> / Вкупно: </span>
                <b class="ms-1" th:text="${page.totalElements}"></b>
            </div>
        </div>
    </div>
    <script th:inline="javascript">
        function updateQueryStringParameter(key, value) {
            var uri = window.location.href;
            var re = new RegExp("([?&])" + key + "=.*?(&|$)", "i");
            var separator = uri.indexOf('?') !== -1 ? "&" : "?";
            if (uri.match(re)) {
                uri = uri.replace(re, '$1' + key + "=" + value + '$2');
            } else {
                uri = uri + separator + key + "=" + value;
            }
            window.location = uri;
        }
    </script>
</div>
