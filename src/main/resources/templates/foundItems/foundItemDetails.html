<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <meta charset="UTF-8">
    <title th:text="${item.title}">Found Item Details</title>
</head>
<body>
<div layout:fragment="content" class="container mt-4 mb-5">
    <!-- Back button -->
    <div class="mb-3">
        <a th:href="@{/found-items}" class="btn btn-outline-secondary btn-sm">
            <i class="fas fa-arrow-left me-1"></i>Back
        </a>
    </div>

    <!-- Title and status badge -->
    <div class="d-flex align-items-center mb-4 flex-wrap gap-3">
        <div class="d-flex align-items-center">
            <i class="fas fa-box-open fs-3 me-3 text-primary-custom"></i>
            <h4 class="mb-0 fw-bold" th:text="${item.title}">Title</h4>
        </div>
        <!-- Display status only if user is NOT a student, OR if the student IS the current holder -->
        <div th:if="${user.role.name() != 'STUDENT' or item.holderId == user.id}">
            <span th:text="${item.status.displayName != null ? item.status.displayName : item.status}"
                  th:class="'badge-relative ' + (${item.status.name() == 'PERMANENTLY_LOST'} ? 'badge-relative-danger' : (${item.status.name() == 'UNRESOLVED'} ? 'badge-relative-tomorrow' : 'badge-relative-soon'))">
            </span>
        </div>
    </div>

    <p th:if="${error}" th:text="${error}" class="alert alert-danger"></p>

    <!-- Main Details Box -->
    <div class="card shadow-sm mb-4 border" style="transform: none !important; box-shadow: 0 .125rem .25rem rgba(0,0,0,.075) !important; transition: none !important;">
        <div class="card-body">
            <!-- Top Metadata -->
            <div class="row g-3">
                <div class="col-md-12">
                    <p class="mb-2"><strong><i class="fas fa-user-check text-primary-custom me-2"></i>Current holder:</strong> <span th:text="${item.holderName}">Holder Name</span></p>
                    <p class="mb-2"><strong><i class="fas fa-user text-primary-custom me-2"></i>Posted by:</strong> <span th:text="${item.posterName}">Poster Name</span></p>
                    <p class="mb-2"><strong><i class="fas fa-calendar-alt text-primary-custom me-2"></i>Date posted:</strong> <span th:text="${#temporals.format(item.datePosted, 'dd.MM.yyyy HH:mm')}"></span></p>
                    <p class="mb-2"><strong><i class="fas fa-clock text-primary-custom me-2"></i>Last updated:</strong> <span th:text="${#temporals.format(item.lastUpdated, 'dd.MM.yyyy HH:mm')}"></span></p>
                </div>
            </div>

            <!-- Description, Location, and Date Found section -->
            <div class="mt-3 pt-3 border-top">
                <!-- Description displayed only if not null -->
                <div th:if="${item.description != null}">
                    <p class="mb-2"><strong>Description:</strong></p>
                    <p class="text-muted" th:text="${item.description}">Description</p>
                </div>

                <div class="mt-3">
                    <p class="mb-2" th:if="${item.dateFound != null}">
                        <strong><i class="fas fa-calendar-check text-primary-custom me-2"></i>Date found:</strong>
                        <span th:text="${#temporals.format(item.dateFound, 'dd.MM.yyyy HH:mm')}"></span>
                    </p>
                    <p class="mb-2" th:if="${item.locationFound != null}">
                        <strong><i class="fas fa-map-marker-alt text-primary-custom me-2"></i>Location:</strong>
                        <span th:text="${item.locationFound}"></span>
                    </p>
                </div>

                <!-- Display Attached Images -->
                <div th:if="${item.images != null and !item.images.empty}" class="mt-4">
                    <h5 class="mb-3"><i class="fas fa-images me-2"></i>Images</h5>
                    <div class="d-flex gap-3 flex-wrap">
                        <div th:each="img : ${item.images}">
                            <a href="#" data-bs-toggle="modal" data-bs-target="#imageModal"
                               th:onclick="'openImageModal(\'' + @{/found-items/images/{id}(id=${img.id})} + '\')'">
                                <img th:src="@{/found-items/images/{id}(id=${img.id})}"
                                     alt="Found Item Image"
                                     class="img-thumbnail"
                                     style="width: 150px; height: 150px; object-fit: cover; cursor: pointer;">
                            </a>
                        </div>
                    </div>
                </div>

                <!-- Holder-only section: actions + transfer search -->
                <div th:if="${item.holderId == user.id}" class="mt-4 pt-3 border-top">
                    <div class="d-flex flex-wrap align-items-center gap-2">
                        <!-- Edit Button -->
                        <a th:href="@{/found-items/edit/{id}(id=${item.id})}"
                           class="btn btn-primary-custom btn-sm"
                           th:classappend="${item.status.name() != 'UNRESOLVED'} ? 'disabled pe-none opacity-50' : ''">
                            <i class="fas fa-edit me-1"></i>Edit
                        </a>

                        <!-- Delete Button -->
                        <form method="post" th:action="@{/found-items/delete/{id}(id=${item.id})}"
                              onsubmit="return confirm('Delete this item?');" style="display:inline; margin:0;">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            <button type="submit" class="btn btn-danger btn-sm"
                                    th:classappend="${item.status.name() != 'UNRESOLVED'} ? 'disabled pe-none opacity-50' : ''"
                                    th:attr="disabled=${item.status.name() != 'UNRESOLVED'} ? 'disabled' : null">
                                <i class="fas fa-trash me-1"></i>Delete
                            </button>
                        </form>

                        <!-- Status Action Buttons (Visible only when UNRESOLVED) -->
                        <th:block th:if="${item.status.name() == 'UNRESOLVED'}">
                            <form id="resolvedForm" method="post" th:action="@{/found-items/update-status/{id}(id=${item.id})}" onsubmit="disableButtons()" style="display:inline; margin:0;">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                <input type="hidden" name="itemStatus" value="RESOLVED"/>
                                <button type="submit" class="btn btn-success btn-sm" id="resolvedBtn">Mark as resolved</button>
                            </form>

                            <form id="lostForm" method="post" th:action="@{/found-items/update-status/{id}(id=${item.id})}" onsubmit="disableButtons()" style="display:inline; margin:0;">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                <input type="hidden" name="itemStatus" value="PERMANENTLY_LOST"/>
                                <button type="submit" class="btn btn-danger btn-sm" id="lostBtn">Mark as lost</button>
                            </form>
                        </th:block>

                        <!-- Retract the one open offer (offering a new one is the search panel below) -->
                        <form th:if="${pendingTransfer != null}" method="post"
                              th:action="@{/found-items/{id}/retract-transfer-offer(id=${item.id})}"
                              style="display:inline; margin:0;">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            <button type="submit" class="btn btn-outline-danger btn-sm">
                                <i class="fas fa-rotate-left me-1"></i>Retract offer to:
                                <span th:text="${pendingTransfer.newHolderName}"></span>
                            </button>
                        </form>
                    </div>

                    <!-- Transfer search: sits inside the holder-only block, and only shows
                         while the item is unresolved with no open offer -->
                    <div id="transfer"
                         th:if="${pendingTransfer == null and item.status.name() == 'UNRESOLVED'}"
                         class="mt-4 pt-3 border-top">
                        <h5 class="mb-3"><i class="fas fa-right-left me-2"></i>Transfer item</h5>

                        <form method="get" th:action="@{/found-items/{id}(id=${item.id})}" class="d-flex gap-2 mb-3">
                            <input type="text" name="query" th:value="${query}" class="form-control"
                                   placeholder="Search for a professor or student by name">
                            <button type="submit" class="btn btn-primary-custom btn-sm">
                                <i class="fas fa-search me-1"></i>Search
                            </button>
                        </form>

                        <p th:if="${query != null and !query.isEmpty() and (results == null or results.empty)}"
                           class="text-muted">No matching users found.</p>

                        <ul th:if="${results != null and !results.empty}" class="list-group">
                            <li class="list-group-item d-flex justify-content-between align-items-center"
                                th:each="candidate : ${results}">
                                <div>
                                    <span th:text="${candidate.name}" class="fw-semibold"></span>
                                    <span class="text-muted small ms-2" th:text="${candidate.id}"></span>
                                </div>
                                <form method="post" th:action="@{/found-items/{id}/create-transfer-offer(id=${item.id})}" style="margin:0;">
                                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                    <input type="hidden" name="holderUsername" th:value="${candidate.id}"/>
                                    <button type="submit" class="btn btn-sm btn-primary-custom">
                                        <i class="fas fa-paper-plane me-1"></i>Send offer
                                    </button>
                                </form>
                            </li>
                        </ul>
                    </div>
                </div>

                <!-- Accept / reject a transfer offered TO the current user -->
                <div th:if="${pendingTransfer != null and pendingTransfer.newHolderId == user.id and item.holderId != user.id}"
                     class="mt-4 pt-3 border-top">
                    <p class="mb-2">
                        <strong><i class="fas fa-right-left text-primary-custom me-2"></i></strong>
                        <span th:text="${item.holderName}"></span> wants to transfer this item to you.
                    </p>
                    <div class="d-flex flex-wrap align-items-center gap-2">
                        <form method="post" th:action="@{/found-items/{id}/accept-transfer(id=${item.id})}" style="display:inline; margin:0;">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            <button type="submit" class="btn btn-success btn-sm">
                                <i class="fas fa-check me-1"></i>Accept transfer
                            </button>
                        </form>
                        <form method="post" th:action="@{/found-items/{id}/reject-transfer(id=${item.id})}" style="display:inline; margin:0;">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            <button type="submit" class="btn btn-danger btn-sm">
                                <i class="fas fa-xmark me-1"></i>Reject transfer
                            </button>
                        </form>
                    </div>
                </div>

                <div class="d-flex align-items-center justify-content-between mb-3 mt-4">
                    <h5 class="mb-0"><i class="fas fa-history me-2"></i>Holder history</h5>
                    <a th:href="@{/found-items/{id}/holder-history(id=${item.id})}" class="btn btn-sm btn-outline-secondary">
                        View full history
                    </a>
                </div>
            </div>
        </div>
    </div>

    <!-- Image Preview Modal -->
    <div class="modal fade" id="imageModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content bg-transparent border-0">
                <div class="modal-body text-center position-relative p-0">
                    <button type="button" class="btn-close btn-close-white position-absolute top-0 end-0 m-3 z-3" data-bs-dismiss="modal" aria-label="Close"></button>
                    <img id="modalImage" src="" class="img-fluid rounded shadow-lg" style="max-height: 85vh; object-fit: contain;" alt="Zoomed Image">
                </div>
            </div>
        </div>
    </div>

    <script>
        function openImageModal(src) {
            document.getElementById('modalImage').src = src;
        }

        function disableButtons() {
            var lb = document.getElementById('lostBtn');
            var rb = document.getElementById('resolvedBtn');
            if (lb) lb.disabled = true;
            if (rb) rb.disabled = true;
        }

        // After a search the page reloads with ?query=..., so jump back to the transfer panel
        (function () {
            var panel = document.getElementById('transfer');
            if (panel && new URLSearchParams(window.location.search).has('query')) {
                panel.scrollIntoView();
            }
        })();
    </script>
</div>
</body>
</html>
