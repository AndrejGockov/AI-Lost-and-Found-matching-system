<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
  <meta charset="UTF-8">
</head>
<body>
<div layout:fragment="content" class="container px-2 py-3">
  <div class="d-flex align-items-center gap-3 mb-3">
    <h1 class="mb-0">Found items</h1>
    <a th:href="@{/found-items/add}" class="btn btn-primary-custom btn-sm"><i class="bi bi-plus-circle me-1"></i>Add found item</a>
  </div>

  <p th:if="${error}" th:text="${error}" class="alert alert-danger"></p>

  <!-- Filter form -->
  <form method="get" th:action="@{/found-items}" class="mb-4 d-flex flex-wrap align-items-end gap-2">
    <div>
      <label class="form-label mb-1">Title</label>
      <input type="text" name="title" th:value="${param.title}" class="form-control">
    </div>

    <!-- employees only -->
    <div th:unless="${isStudent}">
      <label class="form-label mb-1">Poster name</label>
      <input type="text" name="posterName" th:value="${param.posterName}" class="form-control">
    </div>

    <!-- employees only -->
    <div th:unless="${isStudent}">
      <label class="form-label mb-1">Status</label>
      <select name="status" class="form-control">
        <option value="">All</option>
        <option th:each="s : ${itemStatus}"
                th:value="${s}"
                th:text="${s.displayName}"
                th:selected="${param.status != null and param.status[0] == s.name()}"></option>
      </select>
    </div>

    <!-- everyone -->
    <div>
      <label class="form-label mb-1 d-block">Identifiable</label>
      <div class="btn-group" role="group">
        <a th:href="@{/found-items(title=${param.title}, posterName=${param.posterName}, status=${param.status}, identifiable=${null})}"
           class="btn btn-sm"
           th:classappend="${param.identifiable == null} ? 'btn-primary-custom' : 'btn-outline-secondary'">All</a>
        <a th:href="@{/found-items(title=${param.title}, posterName=${param.posterName}, status=${param.status}, identifiable='true')}"
           class="btn btn-sm"
           th:classappend="${param.identifiable != null and param.identifiable[0] == 'true'} ? 'btn-primary-custom' : 'btn-outline-secondary'">Identifiable</a>
        <a th:href="@{/found-items(title=${param.title}, posterName=${param.posterName}, status=${param.status}, identifiable='false')}"
           class="btn btn-sm"
           th:classappend="${param.identifiable != null and param.identifiable[0] == 'false'} ? 'btn-primary-custom' : 'btn-outline-secondary'">Not identifiable</a>
      </div>
    </div>

    <!-- keep the page size chosen in the paging fragment when filtering -->
    <input type="hidden" name="results" th:if="${param.results != null}" th:value="${param.results[0]}">

    <div class="d-flex gap-2">
      <button type="submit" class="btn btn-primary-custom"><i class="bi bi-search me-1"></i>Search</button>
      <a th:if="${param.title != null and !param.title.empty} or ${param.posterName != null and !param.posterName.empty} or ${param.status != null and !param.status.empty} or ${param.identifiable != null and !param.identifiable.empty}"
         th:href="@{/found-items}" class="btn btn-outline-secondary"><i class="bi bi-x-circle me-1"></i>Clear</a>
    </div>
  </form>

  <!-- Found items -->
  <p th:if="${items.empty}" class="text-muted">No found items found.</p>
  <div th:unless="${items.empty}" class="row row-cols-1 row-cols-md-2 row-cols-xl-3 g-3 mb-3">
    <div th:each="item : ${items.content}" class="col">
      <div th:replace="~{fragments/itemCard :: itemCard(
              item=${item},
              basePath='/found-items',
              description=${item.description},
              hasImages=${!item.images.empty},
              canEdit=${item.holderId == user.id},
              showStatus=${!isStudent},
              posterName=${item.posterName},
              holderName=${item.holderName})}"></div>
    </div>
  </div>

  <!-- Pagination -->
  <div th:replace="~{fragments/paging :: pageSection(page=${items})}"></div>
</div>
</body>
</html>
