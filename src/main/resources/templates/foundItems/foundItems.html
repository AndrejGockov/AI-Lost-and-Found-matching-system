<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
  <meta charset="UTF-8">
</head>
<body>
<div layout:fragment="content" class="container px-2 py-3">
  <div class="d-flex align-items-center gap-3 mb-3">
    <h1 class="mb-0">Found items</h1>
    <a th:href="@{/found-items/add}" class="btn btn-primary-custom btn-sm"><i class="bi bi-plus-circle me-1"></i>Add found item</a>
  </div>

  <p th:if="${error}" th:text="${error}" class="alert alert-danger"></p>

  <!-- Filter form -->
  <form method="get" th:action="@{/found-items}" class="mb-4 d-flex flex-wrap align-items-end gap-2">
    <div>
      <label class="form-label mb-1">Title</label>
      <input type="text" name="title" th:value="${param.title}" class="form-control">
    </div>

    <!-- employees only; applies to the unrestricted list -->
    <div th:unless="${isStudent}">
      <label class="form-label mb-1">Poster name</label>
      <input type="text" name="posterName" th:value="${param.posterName}" class="form-control">
    </div>

    <div th:unless="${isStudent}">
      <label class="form-label mb-1">Status</label>
      <select name="status" class="form-control">
        <option value="">All</option>
        <option th:each="s : ${itemStatus}"
                th:value="${s}"
                th:text="${s.displayName}"
                th:selected="${param.status != null and param.status[0] == s.name()}"></option>
      </select>
    </div>

    <!-- keep the page size chosen in the paging fragment when filtering -->
    <input type="hidden" name="results" th:if="${param.results != null}" th:value="${param.results[0]}">

    <div class="d-flex gap-2">
      <button type="submit" class="btn btn-primary-custom"><i class="bi bi-search me-1"></i>Search</button>
      <a th:if="${param.title != null and !param.title.empty} or ${param.posterName != null and !param.posterName.empty} or ${param.status != null and !param.status.empty}"
         th:href="@{/found-items}" class="btn btn-outline-secondary"><i class="bi bi-x-circle me-1"></i>Clear</a>
    </div>
  </form>

  <!-- Unrestricted items: identifiable = true -->
  <h2 class="h4 mt-4">Unrestricted items</h2>
  <p th:if="${fullItems.empty}" class="text-muted">No unrestricted found items found.</p>
  <div th:unless="${fullItems.empty}" class="row row-cols-1 row-cols-md-2 row-cols-xl-3 g-3 mb-3">
    <div th:each="item : ${fullItems.content}" class="col">
      <div th:replace="~{fragments/itemCard :: itemCard(
              item=${item},
              basePath='/found-items',
              description=${item.description},
              hasImages=${item.images != null and !item.images.empty},
              canEdit=${item.holderId == user.id},
              showStatus=${!isStudent},
              posterName=${item.posterName},
              holderName=${item.holderName})}"></div>
    </div>
  </div>

  <!-- Pagination for the unrestricted list -->
  <div th:replace="~{fragments/paging :: pageSection(page=${fullItems})}"></div>

  <!-- Restricted items: identifiable = false (no images, no description) -->
  <h2 class="h4 mt-5">Restricted items</h2>
  <p th:if="${restrictedItems.empty}" class="text-muted">No restricted found items found.</p>
  <div th:unless="${restrictedItems.empty}" class="row row-cols-1 row-cols-md-2 row-cols-xl-3 g-3 mb-3">
    <div th:each="item : ${restrictedItems.content}" class="col">
      <!-- restricted DTO has no description/images, so both are passed as null -->
      <div th:replace="~{fragments/itemCard :: itemCard(
              item=${item},
              basePath='/found-items',
              description=${null},
              hasImages=${null},
              canEdit=${item.holderId == user.id},
              showStatus=${!isStudent},
              posterName=${item.posterName},
              holderName=${item.holderName})}"></div>
    </div>
  </div>

  <!-- Pagination for the restricted list -->
  <div th:replace="~{fragments/paging :: pageSection(page=${restrictedItems})}"></div>
</div>
</body>
</html>
