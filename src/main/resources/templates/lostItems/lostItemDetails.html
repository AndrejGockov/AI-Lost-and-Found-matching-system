<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <meta charset="UTF-8">
    <title th:text="${item.title}">Lost Item Details</title>
</head>
<body>
<div layout:fragment="content" class="container mt-4 mb-5">
    <!-- Back button -->
    <div class="mb-3">
        <a th:href="@{/lost-items}" class="btn btn-outline-secondary btn-sm">
            <i class="fas fa-arrow-left me-1"></i>Back
        </a>
    </div>

    <!-- Title and status badge -->
    <div class="d-flex align-items-center mb-4 flex-wrap gap-3">
        <div class="d-flex align-items-center">
            <i class="fas fa-search fs-3 me-3 text-primary-custom"></i>
            <h4 class="mb-0 fw-bold" th:text="${item.title}">Title</h4>
        </div>
        <!-- Display status only if user is NOT a student, OR if the student IS the poster -->
        <div th:if="${user.role.name() != 'STUDENT' or item.posterId == user.id}">
            <span th:text="${item.status.displayName != null ? item.status.displayName : item.status}"
                  th:class="'badge-relative ' + (${item.status.name() == 'PERMANENTLY_LOST'} ? 'badge-relative-danger' : (${item.status.name() == 'UNRESOLVED'} ? 'badge-relative-tomorrow' : 'badge-relative-soon'))">
            </span>
        </div>
    </div>

    <p th:if="${error}" th:text="${error}" class="alert alert-danger"></p>

    <!-- Main Details Box -->
    <div class="card shadow-sm mb-4 border" style="transform: none !important; box-shadow: 0 .125rem .25rem rgba(0,0,0,.075) !important; transition: none !important;">
        <div class="card-body">
            <!-- Top Metadata -->
            <div class="row g-3">
                <div class="col-md-12">
                    <p class="mb-2"><strong><i class="fas fa-user text-primary-custom me-2"></i>Posted by:</strong> <span th:text="${item.posterName}">Poster Name</span></p>
                    <p class="mb-2" th:if="${item.datePosted != null}">
                        <strong><i class="fas fa-calendar-alt text-primary-custom me-2"></i>Date posted:</strong>
                        <span th:text="${#temporals.format(item.datePosted, 'dd.MM.yyyy HH:mm')}"></span>
                    </p>
                    <p class="mb-2" th:if="${item.lastUpdated != null}">
                        <strong><i class="fas fa-clock text-primary-custom me-2"></i>Updated at:</strong>
                        <span th:text="${#temporals.format(item.lastUpdated, 'dd.MM.yyyy HH:mm')}"></span>
                    </p>
                </div>
            </div>

            <!-- Description, Location, and Date Lost section -->
            <div class="mt-3 pt-3 border-top">
                <!-- Description displayed only if not null -->
                <div th:if="${item.description != null}">
                    <p class="mb-2"><strong>Description:</strong></p>
                    <p class="text-muted" th:text="${item.description}">Description</p>
                </div>

                <div class="mt-3">
                    <p class="mb-2" th:if="${item.dateLost != null}">
                        <strong><i class="fas fa-calendar-alt text-primary-custom me-2"></i>Date lost:</strong>
                        <span th:text="${#temporals.format(item.dateLost, 'dd.MM.yyyy HH:mm')}"></span>
                    </p>
                    <p class="mb-2" th:if="${item.locationLost != null}">
                        <strong><i class="fas fa-map-marker-alt text-primary-custom me-2"></i>Location:</strong>
                        <span th:text="${item.locationLost}"></span>
                    </p>
                </div>

                <!-- Display Attached Images -->
                <div th:if="${item.images != null and !item.images.empty}" class="mt-4">
                    <h5 class="mb-3"><i class="fas fa-images me-2"></i>Images</h5>
                    <div class="d-flex gap-3 flex-wrap">
                        <div th:each="img : ${item.images}">
                            <a href="#" data-bs-toggle="modal" data-bs-target="#imageModal"
                               th:onclick="'openImageModal(\'' + @{/lost-items/images/{id}(id=${img.id})} + '\')'">
                                <img th:src="@{/lost-items/images/{id}(id=${img.id})}"
                                     alt="Lost Item Image"
                                     class="img-thumbnail"
                                     style="width: 150px; height: 150px; object-fit: cover; cursor: pointer;">
                            </a>
                        </div>
                    </div>
                </div>

                <!-- Unified Evenly Spaced Action Buttons -->
                <div th:if="${item.posterId == user.id}" class="mt-4 pt-3 border-top">
                    <div class="d-flex flex-wrap align-items-center gap-2">
                        <!-- Edit Button -->
                        <a th:href="@{/lost-items/edit/{id}(id=${item.id})}"
                           class="btn btn-primary-custom btn-sm"
                           th:classappend="${item.status.name() != 'UNRESOLVED'} ? 'disabled pe-none opacity-50' : ''">
                            <i class="fas fa-edit me-1"></i>Edit
                        </a>

                        <!-- Delete Button -->
                        <form method="post" th:action="@{/lost-items/delete/{id}(id=${item.id})}"
                              onsubmit="return confirm('Delete this item?');" style="display:inline; margin:0;">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            <button type="submit" class="btn btn-danger btn-sm"
                                    th:classappend="${item.status.name() != 'UNRESOLVED'} ? 'disabled pe-none opacity-50' : ''"
                                    th:attr="disabled=${item.status.name() != 'UNRESOLVED'} ? 'disabled' : null">
                                <i class="fas fa-trash me-1"></i>Delete
                            </button>
                        </form>

                        <!-- Status Action Buttons (Visible only when UNRESOLVED) -->
                        <block th:if="${item.status.name() == 'UNRESOLVED'}">
                            <form id="resolvedForm" method="post" th:action="@{/lost-items/update-status/{id}(id=${item.id})}" onsubmit="disableButtons()" style="display:inline; margin:0;">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                <input type="hidden" name="itemStatus" value="RESOLVED"/>
                                <button type="submit" class="btn btn-success btn-sm" id="resolvedBtn">Mark as resolved</button>
                            </form>

                            <form id="lostForm" method="post" th:action="@{/lost-items/update-status/{id}(id=${item.id})}" onsubmit="disableButtons()" style="display:inline; margin:0;">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                <input type="hidden" name="itemStatus" value="PERMANENTLY_LOST"/>
                                <button type="submit" class="btn btn-danger btn-sm" id="lostBtn">Mark as lost</button>
                            </form>
                        </block>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Image Preview Modal -->
    <div class="modal fade" id="imageModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content bg-transparent border-0">
                <div class="modal-body text-center position-relative p-0">
                    <button type="button" class="btn-close btn-close-white position-absolute top-0 end-0 m-3 z-3" data-bs-dismiss="modal" aria-label="Close"></button>
                    <img id="modalImage" src="" class="img-fluid rounded shadow-lg" style="max-height: 85vh; object-fit: contain;" alt="Zoomed Image">
                </div>
            </div>
        </div>
    </div>

    <script>
        function openImageModal(src) {
            document.getElementById('modalImage').src = src;
        }

        function disableButtons() {
            var lostBtn = document.getElementById('lostBtn');
            var resolvedBtn = document.getElementById('resolvedBtn');
            if (lostBtn) lostBtn.disabled = true;
            if (resolvedBtn) resolvedBtn.disabled = true;
        }
    </script>
</div>
</body>
</html>
